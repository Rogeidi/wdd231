<body>

        <div class="logo-titulo-container">
            <img src="imagens/camara-comercio.svg" alt="Logo do Site" width="220" height="220">

            <ul>
                <li><a href="index.html">Página Inicial</a></li>

                <li><a href="diretorio.html">Diretório</a></li>
                <li><a href="associacao.html" class="active">Associe-se</a></li>
            </ul>
        </nav>
    </header>

    <main class="associacion-main">
        <section class="introducao-associacao">
            <h1>Formulário de pedido de Associação</h1>
            <p>Preencha os dados abaixo para solicitar sua inclusão na Câmara de Comércio.</p>
        </section>

        <div class="layout-associacao-grid">

            <section class="formulario-container">
                <form action="agradecimento.html" method="get" id="form-associacao">

                    <label title="Nome do candidato">
                        <span>Nome: *</span>
                        <input type="text" name="nome" id="nome" autocomplete="given-name" required>

                    </label>

                    <label title="Sobrenome do candidato">
                        <span>Sobrenome: *</span>
                        <input type="text" name="sobrenome" id="sobrenome" autocomplete="family-name" required>
                    </label>

                    <label title="Cargo na organização (mínimo de 7 carateres, apeas letras, espaços e hífens)">
                        <span>Cargo na Organização:</span>
                        <input type="text" name="cargo" id="cargo" autocomplete="organization-title"
                            pattern="[A-Za-zÀ-ÿ\s\-]{7,}">
                    </label>

                    <label title="Endereço de e-mail institucional">
                        <span>E-mail: *</span>
                        <input type="email" name="email" id="email" placeholder="exemplo@dominio.com"
                            autocomplete="email" required>
                    </label>

                    <label title="Número de telefone celular">
                        <span>Número de Celular: *</span>
                        <input type="tel" name="celular" id="celular" autocomplete="tel" required>
                    </label>

                    <label title="Nome da empresa ou organização">
                        <span>Nome da Empresa/Organização: *</span>
                        <input type="text" name="organizacao" id="organizacao" autocomplete="organization" required>
                    </label>

                    <label title="Selecione o nível de associação">
                        <span>Nível de Associação: *</span>
                        <select name="nivel_associacao" id="nivel_associacao" required>
                            <option value="" disabled selected>Escolha uma opção...</option>
                            <option value="np">Associação NP (Sem fins lucrativos)</option>
                            <option value="bronze">Associação Bronze</option>
                            <option value="silver">Associação Prata</option>
                            <option value="gold">Associação Ouro</option>
                        </select>
                    </label>

                    <label title="Descrição da atividade da sua organização">
                        <span>Descrição da Atividade/Organização:</span>
                        <textarea name="descricao" id="descricao" rows="4"></textarea>
                    </label>

                    <input type="hidden" name="timestamp" id="timestamp">

                    <div class="botao-wrapper">
                        <input type="submit" value="Enviar Formulário">
                    </div>
                </form>
            </section>

            <section id="container-cartoes-planos">

            </section>
        </div>
    </main>
    <footer>
